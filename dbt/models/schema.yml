version: 2

models:
  - name: fact_ad_performance_daily
    description: One row per (source, campaign, day) with platform and first-party metrics side by side
    columns:
      - name: source
        tests: [not_null]
      - name: campaign_id
        tests: [not_null]
      - name: stat_date
        tests: [not_null]
      - name: spend
        tests: [not_null]

  - name: mart_campaign_daily
    description: Campaign-level daily efficiency (CTR, CAC, ROAS, overclaim)
    columns:
      - name: overclaim_ratio
        description: platform_conversions / fp_conversions; >1 means the platform claims more than first-party truth

  - name: mart_channel_daily
    description: Channel-level daily rollup
    columns:
      - name: source
        tests: [not_null]

  - name: mart_campaign_rolling
    description: >
      Rolling 7-day CAC/ROAS/CTR per campaign plus ctr_vs_peak, a
      creative-fatigue signal (rolling CTR as a fraction of the campaign's own
      best). Excludes the most recent day (first-party order lag).
    columns:
      - name: campaign_id
        tests: [not_null]
      - name: campaign_age_days
        tests: [not_null]
      - name: ctr_vs_peak
        description: 1.0 at the campaign's best rolling CTR; sustained values below ~0.8 suggest creative fatigue

  - name: mart_channel_pacing
    description: Month-to-date spend vs prorated monthly budget (monthly_budgets seed)
    columns:
      - name: pacing_status
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: [over, under, on_track, no_budget]

  - name: mart_campaign_weekly
    description: >
      Week-over-week spend/CAC movement per campaign, with each campaign's
      share of its channel's total spend change (the "which campaign drove
      the change" decomposition).
    columns:
      - name: week_start
        tests: [not_null]
